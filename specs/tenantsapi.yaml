openapi: '3.0.2'

info:
  title: Superdesk Multi-Tenancy API
  version: "1.0"
  description: |
    HTTP surface added by multi-tenancy (see MULTITENANCY_IMPLEMENTATION.md).

    Three groups of endpoints:

    * **Tenant admin** (`/tenant-admin/*`) — control-plane administration, served only on the
      reserved non-tenant host (`TENANT_ADMIN_HOST`) and guarded by a static bearer token
      (`TENANT_ADMIN_API_TOKEN`). Fail-closed: unless multi-tenancy is enabled, the token is
      configured and matches, and the request host equals the admin host, every endpoint
      responds `404` — the API does not advertise itself.
    * **Accounts** (`/accounts/me/tenants`) — served on tenant hosts to session-authenticated
      users; powers the client tenant switcher.
    * **Exchange** (`/archive/send_to_tenant`) — served on tenant hosts; manually sends an
      archive item to a partner tenant, guarded by the `send_to_tenant` privilege.

    **Outgoing webhooks** (not paths of this API): any number of webhook endpoints can be
    registered via `/tenant-admin/webhooks` (`TENANT_WEBHOOK_URL`/`_SECRET` act as one
    implicit webhook). The server POSTs JSON lifecycle events to every enabled endpoint:
    `tenant.suspended`,
    `tenant.activated`, `tenant.deleted` (soft delete, data retained), `tenant.purged` (data
    emptied after `TENANT_DELETED_RETENTION_DAYS`) and `tenant.test` (manual test). Payload:
    `{event, tenant, status, hosts, timestamp, deleted_at?, purged_at?}`; delivered async with
    retries; signed with HMAC-SHA256 in `X-Superdesk-Signature: sha256=<hexdigest>` when a
    secret is set.

paths:
  /tenant-admin/login:
    post:
      summary: Start a tenant-admin session
      description: |
        Authenticates with shared-account credentials; the account must be enabled and
        flagged `is_super_admin` (grant via `accounts:set-super-admin --email ...` or the
        accounts PATCH endpoint). On success a signed session cookie scoped to the admin
        host is set; all `/tenant-admin/*` endpoints then accept the session as an
        alternative to the bearer token. Requires `SHARED_ACCOUNTS_ENABLED`.
      tags:
        - Tenant admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '200':
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  _status: {type: string, example: OK}
                  email: {type: string}
        '401':
          description: Invalid credentials or account lacks super-admin rights (indistinguishable)
        '404':
          description: Wrong host, multi-tenancy off or shared accounts off

  /tenant-admin/logout:
    post:
      summary: End the tenant-admin session
      tags:
        - Tenant admin
      responses:
        '200':
          description: Session ended

  /tenant-admin/me:
    get:
      summary: Current admin identity
      tags:
        - Tenant admin
      security:
        - adminSession: []
        - adminToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth: {type: string, enum: [session, token]}
                  email: {type: string, description: Present for session auth.}
        '404':
          $ref: '#/components/responses/NotAuthorized'

  /tenant-admin/accounts:
    get:
      summary: List shared accounts
      tags:
        - Tenant admin
      security:
        - adminSession: []
        - adminToken: []
      responses:
        '200':
          description: Accounts (never includes password hashes)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotAuthorized'
    post:
      summary: Create an account (or update its credentials)
      tags:
        - Tenant admin
      security:
        - adminSession: []
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                username: {type: string}
                password: {type: string}
                is_super_admin: {type: boolean, default: false}
      responses:
        '201':
          description: Created/updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Missing email or password
        '404':
          $ref: '#/components/responses/NotAuthorized'

  /tenant-admin/accounts/{email}:
    patch:
      summary: Update account flags or password
      description: |
        A session admin cannot revoke their own `is_enabled`/`is_super_admin` (400).
      tags:
        - Tenant admin
      security:
        - adminSession: []
        - adminToken: []
      parameters:
        - name: email
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_enabled: {type: boolean}
                is_super_admin: {type: boolean}
                needs_password_reset: {type: boolean}
                password: {type: string}
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Attempt to revoke own admin access
        '404':
          description: Unknown account (or not authorized)

  /tenant-admin/tenants/{slug}/users:
    post:
      summary: Create a user inside a tenant
      description: |
        Cross-tenant user administration: creates a tenant-local user (optionally an
        administrator). With shared accounts enabled the credentials are automatically
        linked to (or create) the matching control-plane account.
      tags:
        - Tenant admin
      security:
        - adminSession: []
        - adminToken: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, email]
              properties:
                username: {type: string}
                password: {type: string}
                email: {type: string, format: email}
                admin: {type: boolean, default: false}
      responses:
        '201':
          description: User created (noop if the username already exists in the tenant)
        '400':
          description: Missing fields
        '404':
          description: Unknown tenant (or not authorized)

  /tenant-admin/webhooks:
    get:
      summary: List webhooks
      description: |
        All registered webhooks plus the implicit config-file one (id `config`, read only,
        present when `TENANT_WEBHOOK_URL` is set). Secrets are never returned (`has_secret`).
      tags:
        - Tenant admin
      security:
        - adminSession: []
        - adminToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '404':
          $ref: '#/components/responses/NotAuthorized'
    post:
      summary: Register a webhook
      description: |
        Every enabled webhook receives all tenant lifecycle events.
      tags:
        - Tenant admin
      security:
        - adminSession: []
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, example: "https://hooks.example.com/tenants"}
                secret: {type: string, description: HMAC-SHA256 signing secret (write only).}
                name: {type: string}
                is_enabled: {type: boolean, default: true}
      responses:
        '201':
          description: Created webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: Missing or invalid url
        '404':
          $ref: '#/components/responses/NotAuthorized'

  /tenant-admin/webhooks/{webhookId}:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema: {type: string}
    patch:
      summary: Update a webhook
      description: |
        Same fields as create; `secret` is write-only (omit = keep, empty string = clear).
        The implicit `config` webhook is read only (`400`).
      tags:
        - Tenant admin
      security:
        - adminSession: []
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: {type: string}
                secret: {type: string}
                name: {type: string}
                is_enabled: {type: boolean}
      responses:
        '200':
          description: Updated webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: Invalid url or attempting to edit the config webhook
        '404':
          description: Unknown webhook (or not authorized)
    delete:
      summary: Delete a webhook
      tags:
        - Tenant admin
      security:
        - adminSession: []
        - adminToken: []
      responses:
        '200':
          description: Deleted
        '400':
          description: The config webhook cannot be deleted
        '404':
          description: Unknown webhook (or not authorized)

  /tenant-admin/webhooks/{webhookId}/test:
    post:
      summary: Send a test event to one webhook
      description: |
        Synchronously delivers a `tenant.test` event and reports the receiver's HTTP status;
        `502` with the error message when delivery fails. Works for the `config` webhook too.
      tags:
        - Tenant admin
      security:
        - adminSession: []
        - adminToken: []
      parameters:
        - name: webhookId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  _status: {type: string, example: OK}
                  response_status: {type: integer, example: 204}
        '502':
          description: Delivery failed
        '404':
          description: Unknown webhook (or not authorized)

  /tenant-admin/tenants:
    get:
      summary: List tenants
      tags:
        - Tenant admin
      security:
        - adminToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotAuthorized'
    post:
      summary: Create and provision a tenant
      description: |
        Creates the tenant record and runs the resumable provisioning flow (mongo indexes,
        elastic mappings, seed data, optional initial admin user). Re-run with `resume: true`
        to continue a partially provisioned tenant.
      tags:
        - Tenant admin
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, hosts]
              properties:
                slug:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{0,61}$'
                  example: tenant-a
                name:
                  type: string
                  description: Display name (defaults to the slug).
                description:
                  type: string
                hosts:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  example: [tenant-a.example.com]
                admin:
                  type: object
                  description: Initial admin user, created in the tenant.
                  required: [username, password, email]
                  properties:
                    username: {type: string}
                    password: {type: string}
                    email: {type: string, format: email}
                resume:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Tenant provisioned and active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          description: Invalid slug, missing hosts or incomplete admin spec
        '409':
          description: Tenant already exists (use `resume` to continue provisioning)
        '404':
          $ref: '#/components/responses/NotAuthorized'

  /tenant-admin/tenants/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a tenant
      tags:
        - Tenant admin
      security:
        - adminToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          description: Unknown tenant (or not authorized)
    patch:
      summary: Update tenant status or exchange partners
      description: |
        `status: suspended|active` (fires `tenant.suspended`/`tenant.activated` webhooks).
        Setting `active` on a soft-deleted tenant restores it — allowed only until the
        retention purge has emptied it (`409` afterwards). `status: deleted` is rejected
        (use DELETE).
      tags:
        - Tenant admin
      security:
        - adminSession: []
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/TenantStatus'
                name:
                  type: string
                  description: Display name (empty falls back to the slug).
                description:
                  type: string
                exchange_partners:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExchangePartner'
                exchange_copy_media:
                  type: boolean
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          description: Invalid status or unknown partner tenant
        '404':
          description: Unknown tenant (or not authorized)
    delete:
      summary: Soft-delete a tenant
      description: |
        The tenant must be disabled (suspended) first. The tenant is only *marked* deleted
        (`status: deleted`, `deleted_at` stamped): its hosts answer 404, it drops out of beat
        fan-out, exchange targets and tenant switchers, but **all data stays intact**. The
        periodic purge empties it (mongo databases incl. GridFS and versions, elastic indexes;
        not S3 media) after `TENANT_DELETED_RETENTION_DAYS` (default 30). Until purged it can
        be restored with `PATCH {"status": "active"}`. Fires the `tenant.deleted` webhook
        (and later `tenant.purged` when the purge runs).
      tags:
        - Tenant admin
      security:
        - adminSession: []
        - adminToken: []
      responses:
        '200':
          description: Marked deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  _status: {type: string, example: OK}
                  retention_days: {type: integer, example: 30}
        '409':
          description: Tenant is still active, or already deleted
        '404':
          description: Unknown tenant (or not authorized)

  /accounts/me/tenants:
    get:
      summary: List the current user's tenants
      description: |
        Active tenants where the logged-in user's shared account has a linked user.
        Requires `SHARED_ACCOUNTS_ENABLED`; returns an empty list otherwise. The client
        redirects to one of the returned hosts and the user logs in there — sessions
        never span tenants.
      tags:
        - Accounts
      security:
        - session: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items:
                      type: object
                      properties:
                        tenant:
                          type: string
                          example: tenant-a
                        name:
                          type: string
                        hosts:
                          type: array
                          items:
                            type: string
                  is_super_admin:
                    type: boolean
                    description: >
                      Whether the user's account may manage tenants
                      (gates the "Tenant administration" menu entry).
        '401':
          description: Not authenticated

  /accounts/me/switch-token:
    post:
      summary: Issue a one-time token to sign in on another tenant
      description: |
        Tenant-switcher SSO, step 1. Issues a short-lived (60 s), single-use,
        signed token bound to the target tenant. The client redirects to
        `https://{target host}/?tenant_switch={token}` and the target tenant
        exchanges it via `POST /accounts/switch-login`. Requires
        `SHARED_ACCOUNTS_ENABLED` and an account-linked user.
      tags:
        - Accounts
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant]
              properties:
                tenant:
                  type: string
                  example: tenant-b
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  tenant: {type: string}
                  hosts:
                    type: array
                    items: {type: string}
        '400':
          description: Unknown/inactive target tenant or the account has no user there
        '401':
          description: Not authenticated
        '404':
          description: Shared accounts disabled or user has no account link

  /accounts/switch-login:
    post:
      summary: Exchange a one-time switch token for a session on this tenant
      description: |
        Tenant-switcher SSO, step 2, called on the **target** tenant host.
        Unauthenticated by design — it is the sign-in. Validates signature,
        age (60 s), single-use nonce and the tenant binding, then creates a
        session for the account's linked user. The response has the same
        shape as the `auth_db` login response.
      tags:
        - Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id: {type: string, description: Session id}
                  token: {type: string, description: Session token}
                  user: {type: string, description: User id}
        '401':
          description: Invalid, expired, replayed or misdirected token (indistinguishable)
        '404':
          description: Unknown tenant host or shared accounts disabled

  /exchange/partners:
    get:
      summary: List tenants the current tenant may send content to
      description: |
        Partner allowlist entries with direction `send`/`both` whose target tenant is active
        and accepts content from this tenant. Empty on single-tenant deployments. Backs the
        target picker of "send to tenant" and the `internal_tenant` destination form.
      tags:
        - Exchange
      security:
        - session: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  partners:
                    type: array
                    items:
                      type: object
                      properties:
                        tenant:
                          type: string
                          example: tenant-b
                        name:
                          type: string
                        hosts:
                          type: array
                          items:
                            type: string
        '401':
          description: Not authenticated

  /archive/send_to_tenant:
    post:
      summary: Send an archive item to a partner tenant
      description: |
        Manual counterpart of the subscriber-based exchange: formats the item as ninjs,
        copies its media into the target tenant's storage and ingests it there. Both
        tenants must allow each other on their `exchange_partners` lists. Requires the
        `send_to_tenant` privilege.
      tags:
        - Exchange
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id, target_tenant]
              properties:
                item_id:
                  type: string
                target_tenant:
                  type: string
                  example: tenant-b
                desk:
                  type: string
                  description: Target desk id for auto-fetch.
                stage:
                  type: string
                  description: Target stage id for auto-fetch.
                auto_fetch:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Item queued for delivery to the target tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  _status: {type: string, example: OK}
                  item_id: {type: string}
                  target_tenant: {type: string}
        '400':
          description: Missing fields, unknown/inactive target or tenants are not exchange partners
        '401':
          description: Not authenticated
        '403':
          description: Missing the send_to_tenant privilege
        '404':
          description: Item not found

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: |
        Static token from `TENANT_ADMIN_API_TOKEN` (automation/ops); requests must also
        target `TENANT_ADMIN_HOST`. Failing the guard yields `404`, not `401`.
    adminSession:
      type: apiKey
      in: cookie
      name: session
      description: |
        Signed session cookie set by `POST /tenant-admin/login` (super-admin shared
        account); scoped to the admin host. Used by the tenant administration panel.
    session:
      type: apiKey
      in: cookie
      name: session_token
      description: Regular Superdesk session (Authorization header token also accepted).

  responses:
    NotAuthorized:
      description: |
        Returned whenever the admin guard fails (multi-tenancy off, token missing/wrong,
        or wrong host) — indistinguishable from a nonexistent route by design.

  schemas:
    Webhook:
      type: object
      properties:
        _id: {type: string, description: Webhook id; the literal `config` for the config-file webhook.}
        name: {type: string}
        url: {type: string}
        has_secret: {type: boolean}
        is_enabled: {type: boolean}
        _created: {type: string, format: date-time}
        _updated: {type: string, format: date-time}

    Account:
      type: object
      properties:
        _id: {type: string}
        email: {type: string, format: email}
        username: {type: string}
        is_enabled: {type: boolean}
        is_super_admin: {type: boolean}
        needs_password_reset: {type: boolean}
        password_changed_on: {type: string, format: date-time}
        tenants:
          type: array
          description: Tenants where this account has a linked user.
          items: {type: string}
        _created: {type: string, format: date-time}
        _updated: {type: string, format: date-time}

    TenantStatus:
      type: string
      enum: [creating, active, suspended, deleted]

    ExchangePartner:
      type: object
      required: [tenant]
      properties:
        tenant:
          type: string
          example: tenant-b
        direction:
          type: string
          enum: [send, receive, both]
          default: both

    Tenant:
      type: object
      properties:
        slug:
          type: string
          example: tenant-a
        name:
          type: string
          description: Human-readable display name (defaults to the slug).
          example: Tenant A Newsroom
        description:
          type: string
          description: Free-text description shown in the admin panel.
        hosts:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/TenantStatus'
        db_prefix:
          type: string
          example: sd_tenant_a
        elastic_prefix:
          type: string
          example: sd_tenant_a
        s3_subfolder:
          type: string
          nullable: true
        config_overrides:
          type: object
          additionalProperties: true
        feature_flags:
          type: object
          additionalProperties:
            type: boolean
        exchange_partners:
          type: array
          items:
            $ref: '#/components/schemas/ExchangePartner'
        exchange_copy_media:
          type: boolean
          default: true
          description: >
            Copy exchanged media (pictures/audio/video) into this tenant's storage and rewrite
            asset urls to this tenant; when false, exchanged items keep the source tenant's
            asset urls.
        provisioning:
          type: object
          description: Completed provisioning steps mapped to timestamps.
          additionalProperties:
            type: string
            format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Set when the tenant was soft-deleted; the purge runs TENANT_DELETED_RETENTION_DAYS later.
        purged_at:
          type: string
          format: date-time
          nullable: true
          description: Set once the retention purge emptied the tenant; restoring is no longer possible.
        _created:
          type: string
          format: date-time
        _updated:
          type: string
          format: date-time
